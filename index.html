          '<input class="nm" data-id="' + p.id + '" data-field="name" value="' + esc(p.name) + '" placeholder="Player name">' +
          '<button class="delbtn" onclick="app.removePlayer(\'' + p.id + '\')">&#10005;</button>' +
        '</div>' +
        '<div class="chips">' + chips + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('app').innerHTML =
      '<div class="hdr">' +
        '<div class="backrow">' +
          '<button class="backbtn" onclick="app.goMain()" aria-label="Back">' + icn(ICONS.back) + '</button>' +
          '<div class="brand"><b>ROSTER &amp; LINEUPS</b><span>Assign O1–O3 / D1–D3</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="scrollbody">' +
      '<button class="newgame' + (pendingAction==='newgame'?' danger':'') + '" onclick="app.newGame()">' +
        (pendingAction==='newgame' ? '\u26A0 Tap again to reset all play counts to 0' : '\u21BB Start new game (reset all play counts)') +
      '</button>' +
      (pendingAction==='newgame' ? '<button class="newgame cancel" onclick="app.cancelPending()">Cancel</button>' : '') +
      '<div class="sectitle">Team setup</div>' +
      '<div class="sheetbox panel' + (panelOpen('config') ? ' open' : '') + '">' +
        '<button class="panelhead" onclick="app.togglePanel(\'config\')">' +
          '<span>' + esc(teamName()) + ' \u00B7 ' + minPlays() + ' min \u00B7 ' + onField() + ' on field</span>' + icn(ICONS.chev) +
        '</button>' +
        (panelOpen('config') ? '<div class="panelbody">' +
          '<label class="cfgrow"><span>Team name<small>Used on shared reports</small></span>' +
            '<input class="cfgtext" id="cfg-team" value="' + esc(state.teamName) + '" placeholder="Team name" maxlength="40"></label>' +
          '<label class="cfgrow"><span>Minimum plays<small>Per player, per game</small></span>' +
            '<span class="stepper">' +
              '<button onclick="app.stepNumber(\'minPlays\',-1)" aria-label="Fewer">\u2212</button>' +
              '<input id="cfg-min" inputmode="numeric" value="' + minPlays() + '">' +
              '<button onclick="app.stepNumber(\'minPlays\',1)" aria-label="More">+</button>' +
            '</span></label>' +
          '<label class="cfgrow"><span>Players on field<small>Per lineup</small></span>' +
            '<span class="stepper">' +
              '<button onclick="app.stepNumber(\'onField\',-1)" aria-label="Fewer">\u2212</button>' +
              '<input id="cfg-field" inputmode="numeric" value="' + onField() + '">' +
              '<button onclick="app.stepNumber(\'onField\',1)" aria-label="More">+</button>' +
            '</span></label>' +
          '<p class="cfgnote">Changes apply everywhere at once \u2014 the ready indicator, lineup limits, \u201Cdone\u201D coloring, and exports.</p>' +
        '</div>' : '') +
      '</div>' +
      '<div class="sectitle">Import / export roster</div>' +
      '<div class="sheetbox panel' + (panelOpen('paste') ? ' open' : '') + '">' +
        '<button class="panelhead" onclick="app.togglePanel(\'paste\')">' +
          '<span>Paste from sheet</span>' + icn(ICONS.chev) +
        '</button>' +
        (panelOpen('paste') ? '<div class="panelbody">' +
        '<p>Copy the roster from your sheet, header row included. Replaces the current roster.</p>' +
        '<textarea id="paste-data" placeholder="Jersey #&#9;Name&#9;O1&#9;O2&#9;O3&#9;D1&#9;D2&#9;D3&#10;15&#9;Sam Rivera&#9;x&#9;&#9;&#9;x">' + esc(pasteDraft) + '</textarea>' +
        '<button class="impbtn wide' + (pendingAction==='import'?' danger':'') + '" onclick="app.importPaste()">' +
          (pendingAction==='import' ? '\u26A0 Tap again to replace roster' : 'Import pasted roster') +
        '</button>' +
        (pendingAction==='import' ? '<button class="impbtn wide ghost" onclick="app.cancelPending()">Cancel</button>' : '') +
        (importMsg && importMsg.scope === 'paste' ? '<div class="impmsg ' + (importMsg.ok===true?'ok':importMsg.ok===false?'err':'') + '">' + importMsg.text + '</div>' : '') +
        '</div>' : '') +
      '</div>' +
      '<div class="sheetbox panel' + (panelOpen('file') ? ' open' : '') + '">' +
        '<button class="panelhead" onclick="app.togglePanel(\'file\')">' +
          '<span>Upload CSV file</span>' + icn(ICONS.chev) +
        '</button>' +
        (panelOpen('file') ? '<div class="panelbody">' +
        '<p>Row 1 must be the column headers:</p>' +
        '<div class="csvwrap"><table class="csvtable">' +
          '<tr><th>Jersey #</th><th>Name</th><th>O1</th><th>O2</th><th>O3</th><th>D1</th><th>D2</th><th>D3</th></tr>' +
          '<tr><td>15</td><td>Sam R.</td><td>x</td><td></td><td></td><td>x</td><td></td><td></td></tr>' +
          '<tr><td>4</td><td>Alex K.</td><td></td><td>x</td><td></td><td></td><td></td><td>x</td></tr>' +
        '</table></div>' +
        '<ul class="csvnotes">' +
          '<li>Put any mark (like <b>x</b>) in a lineup column to assign that player. Leave it blank if not.</li>' +
          '<li>Only <b>Name</b> is required. Jersey # is how play counts carry over when you re-import.</li>' +
          '<li>Column order doesn\u2019t matter, and extra columns are ignored.</li>' +
          '<li>From Google Sheets: <b>File \u2192 Download \u2192 CSV</b>. In the phone app: <b>\u22EE \u2192 Share &amp; export \u2192 Send a copy \u2192 CSV</b>, then Save to Files.</li>' +
        '</ul>' +
        '<p class="csvwarn">Replaces the current roster. The file stays on your phone.</p>' +
        (pendingAction==='file'
          ? '<button class="impbtn wide danger" onclick="app.confirmFile()">\u26A0 Replace roster</button>' +
            '<button class="impbtn wide ghost" onclick="app.cancelPending()">Cancel</button>'
          : '<button class="impbtn wide" onclick="app.pickFile()">Choose CSV file</button>') +
        (importMsg && importMsg.scope === 'file' ? '<div class="impmsg ' + (importMsg.ok===true?'ok':importMsg.ok===false?'err':'') + '">' + importMsg.text + '</div>' : '') +
        '</div>' : '') +
      '</div>' +
      '<button class="exportbtn" onclick="app.exportRoster()">' + icn(ICONS.csv) +
        '<span>Download roster CSV<small>Players and lineup assignments, ready to re-import</small></span>' +
      '</button>' +
      '<div class="sectitle">Lineups</div>' +
      '<div class="summary">' + summary + '</div>' +
      '<div class="sectitle">Add player</div>' +
      '<div class="addform">' +
        '<input class="num" id="new-number" placeholder="#" inputmode="numeric">' +
        '<input class="nm" id="new-name" placeholder="Player name" onkeydown="if(event.key===\'Enter\')app.addPlayer()">' +
        '<button onclick="app.addPlayer()">Add</button>' +
      '</div>' +
      '<div class="sectitle">Roster (' + state.players.length + ')</div>' +
      '<div>' + (rows || '<div class="empty">No players yet — add your first one above.</div>') + '</div>' +
      '<div class="buildtag">Build v41 \u00B7 <button class="updatelink" onclick="app.checkUpdate()">Check for updates</button>' +
        (updateMsg ? '<br><span class="updatemsg">' + esc(updateMsg) + '</span>' : '') +
        (showForce ? '<br><button class="updatelink force" onclick="app.forceRefresh()">Still stale? Force refresh (needs connection)</button>' : '') +
        '<br><span class="diag">' + diagLine() + '</span></div>' +
      '</div>';
  }

  var renderedScreen = null;

  function render(){
    // Re-rendering replaces the list's markup, which resets its scroll position.
    // Capture it first and put it back, so tapping a player doesn't jump to the top.
    var prevPane = document.querySelector('.list, .scrollbody');
    var prevTop = prevPane ? prevPane.scrollTop : 0;
    var sameScreen = renderedScreen === state.screen;

    if (state.screen === 'settings') renderSettings();
    else renderMain();
    renderedScreen = state.screen;

    if (sameScreen && prevTop){
      var pane = document.querySelector('.list, .scrollbody');
      if (pane) pane.scrollTop = prevTop;
    }

    var extra = '';
    if (toastMsg){
      extra += '<div class="toast">' + esc(toastMsg) + '</div>';
    }
    if (shareOpen){
      var canShare = typeof navigator !== 'undefined' && !!navigator.share;
      extra += '<div class="overlay" onclick="app.closeShare()">' +
        '<div class="sheet" onclick="event.stopPropagation()">' +
          '<div class="sheettitle">Share play counts</div>' +
          '<div class="sharelist">' +
            '<button class="shareopt" onclick="app.shareVia(\'image\')">' + icn(ICONS.image) + 'Share as image</button>' +
            '<button class="shareopt" onclick="app.shareVia(\'copy\')">' + icn(ICONS.copy) + 'Copy to clipboard</button>' +
            (canShare ? '<button class="shareopt" onclick="app.shareVia(\'share\')">' + icn(ICONS.share) + 'Share\u2026</button>' : '') +
            '<button class="shareopt" onclick="app.shareVia(\'csv\')">' + icn(ICONS.csv) + 'Save as CSV</button>' +
          '</div>' +
          '<button class="impbtn ghostwide" onclick="app.closeShare()">Cancel</button>' +
        '</div>' +
      '</div>';
    }
    if (editDraft){
      var ep = find(editDraft.id);
      if (!ep){ editDraft = null; }
      else {
        var etot = editDraft.q.reduce(function(a,b){ return a + b; }, 0);
        var ecol = statusColor(etot);
        var changed = etot !== ep.plays || editDraft.q.some(function(v,i){ return v !== (ep.q||[0,0,0,0])[i]; });
        var overQ = [];
        editDraft.q.forEach(function(v,i){ if (v > (state.quarterSnaps[i] || 0)) overQ.push(i); });
        var canSave = changed && !overQ.length;
        extra += '<div class="overlay" onclick="app.cancelEdit()">' +
          '<div class="sheet" onclick="event.stopPropagation()">' +
            '<div class="edithead">' +
              '<span class="editjersey">' + esc(ep.number || '\u2014') + '</span>' +
              '<span class="editname">' + esc(ep.name) + '</span>' +
            '</div>' +
            '<div class="editrows">' +
              editDraft.q.map(function(v, i){
                var cap = state.quarterSnaps[i] || 0;
                var over = v > cap;
                return '<div class="editrow' + (state.quarter===i+1?' now':'') + (over?' over':'') + '">' +
                  '<span class="editq">Q' + (i+1) + '<small>' + cap + ' team snap' + (cap===1?'':'s') + '</small></span>' +
                  '<span class="stepper">' +
                    '<button onclick="app.editStep(' + i + ',-1)" aria-label="Q' + (i+1) + ' minus one"' + (v ? '' : ' disabled') + '>\u2212</button>' +
                    '<span class="editval">' + v + '</span>' +
                    '<button onclick="app.editStep(' + i + ',1)" aria-label="Q' + (i+1) + ' plus one"' + (v < cap ? '' : ' disabled') + '>+</button>' +
                  '</span>' +
                '</div>';
              }).join('') +
              '<div class="editrow total">' +
                '<span class="editq">Total<small>of ' + state.totalSnaps + ' team snaps</small></span>' +
                '<span class="edittot count ' + ecol + '">' + etot + '</span>' +
              '</div>' +
            '</div>' +
            (overQ.length
              ? '<p class="editnote err">' + overQ.map(function(i){ return 'Q' + (i+1); }).join(', ') +
                ' can\u2019t be more than the team\u2019s snaps in that quarter. Lower ' + (overQ.length===1?'it':'them') + ' to save.</p>'
              : '<p class="editnote">Can\u2019t exceed the team\u2019s snaps in each quarter. Team totals are unchanged.</p>') +
            '<button class="impbtn wide editsave"' + (canSave ? '' : ' disabled') + ' onclick="app.saveEdit()">Save changes</button>' +
            '<button class="impbtn ghostwide" onclick="app.cancelEdit()">Cancel</button>' +
          '</div>' +
        '</div>';
      }
    }
    if (imagePreview){
      extra += '<div class="overlay" onclick="app.closeImagePreview()">' +
        '<div class="sheet" onclick="event.stopPropagation()">' +
          '<div class="sheettitle">Play counts image</div>' +
          '<p>Press and hold the image to save or share it.</p>' +
          '<img class="imgpreview" src="' + imagePreview + '" alt="Play counts table">' +
          '<button class="impbtn ghostwide" onclick="app.closeImagePreview()">Done</button>' +
        '</div>' +
      '</div>';
    }
    if (copyFallback){
      extra += '<div class="overlay">' +
        '<div class="sheet">' +
          '<p>Copying automatically was blocked here. Select the text below and copy it manually.</p>' +
          '<textarea id="copy-out" readonly>' + esc(copyFallback) + '</textarea>' +
          '<button class="impbtn wide" onclick="app.closeCopyFallback()">Close</button>' +
        '</div>' +
      '</div>';
    }
    if (extra){
      document.getElementById('app').insertAdjacentHTML('beforeend', extra);
      var out = document.getElementById('copy-out');
      if (out){ out.focus(); out.select(); }
    }
  }

  // delegated input listener so typing in roster fields never triggers a re-render (keeps focus/cursor intact)
  document.getElementById('app').addEventListener('input', function(e){
    var t = e.target;
    if (t.matches && t.matches('[data-field]')){
      var id = t.getAttribute('data-id');
      var field = t.getAttribute('data-field');
      var p = find(id);
      if (p){ p[field] = t.value; scheduleSave(); }
    }
    if (t.id === 'paste-data'){ pasteDraft = t.value; }
    if (t.id === 'cfg-team'){ app.setTeamName(t.value); }
  });

  // Reads a picked roster file entirely on-device — nothing is uploaded anywhere.
  document.getElementById('roster-file').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      pendingFile = { name: f.name, text: String(reader.result || '') };
      if (!state.players.length){ app.confirmFile(); return; }
      pendingAction = 'file';
      importMsg = { text: 'Replace the roster with ' + esc(f.name) + '? Anyone not in the file is removed; play counts are kept for jersey numbers still on it.', ok: null, scope: 'file' };
      render();
    };
    reader.onerror = function(){
      importMsg = { text: 'Couldn\u2019t open that file.', ok: false, scope: 'file' };
      render();
    };
    reader.readAsText(f);
  });

  // Number fields commit when the user leaves them or presses Enter, so typing
  // an intermediate value never fights the clamp.
  document.getElementById('app').addEventListener('change', function(e){
    var t = e.target;
    if (t.id === 'cfg-min') app.commitNumber('minPlays', t.value);
    if (t.id === 'cfg-field') app.commitNumber('onField', t.value);
  });
  document.getElementById('app').addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (t.id === 'cfg-min' || t.id === 'cfg-field'){ e.preventDefault(); t.blur(); }
  });

  // ---------- long-press on a player row ----------
  // iOS has no dependable long-press event, so it's timed by hand: hold ~480ms without
  // moving more than a few px. Moving (scrolling) or lifting early cancels it.
  var LP_MS = 480, LP_SLOP = 10;
  var lp = null;                 // { id, x, y, timer, row }
  var swallowClick = false;      // eats the tap that ends a long-press

  function lpCancel(){
    if (!lp) return;
    clearTimeout(lp.timer);
    if (lp.row) lp.row.classList.remove('pressing');
    lp = null;
  }
  var appEl = document.getElementById('app');
  appEl.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var row = e.target.closest && e.target.closest('.row[data-pid]');
    if (!row) return;
    lpCancel();
    lp = { id: row.getAttribute('data-pid'), x: e.clientX, y: e.clientY, row: row };
    row.classList.add('pressing');
    lp.timer = setTimeout(function(){
      var id = lp && lp.id;
      lpCancel();
      if (!id) return;
      swallowClick = true;
      setTimeout(function(){ swallowClick = false; }, 700);
      haptic();
      app.openEditor(id);
    }, LP_MS);
  });
  appEl.addEventListener('pointermove', function(e){
    if (!lp) return;
    if (Math.abs(e.clientX - lp.x) > LP_SLOP || Math.abs(e.clientY - lp.y) > LP_SLOP) lpCancel();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    appEl.addEventListener(ev, lpCancel);
  });
  appEl.addEventListener('scroll', lpCancel, true);
  // Capture phase, so the swallowed tap never reaches the row's own onclick
  document.addEventListener('click', function(e){
    if (!swallowClick) return;
    if (e.target.closest && e.target.closest('.row[data-pid]')){
      e.stopPropagation(); e.preventDefault();
      swallowClick = false;
    }
  }, true);
  // Android and desktop fire contextmenu on long-press/right-click: suppress the menu,
  // and on desktop treat right-click as "edit"
  appEl.addEventListener('contextmenu', function(e){
    var row = e.target.closest && e.target.closest('.row[data-pid]');
    if (!row) return;
    e.preventDefault();
    if (e.pointerType === 'mouse' || (e.button === 2)){ lpCancel(); app.openEditor(row.getAttribute('data-pid')); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && editDraft) app.cancelEdit();
  });

  // ---------- init ----------
  storage.get().then(function(raw){
    if (raw){
      try{
        var loaded = JSON.parse(raw);
        if (loaded && Array.isArray(loaded.players)){
          state.players = loaded.players;
          state.sortMode = loaded.sortMode || 'plays';
          state.selected = Array.isArray(loaded.selected) ? loaded.selected : [];
          state.history = Array.isArray(loaded.history) ? loaded.history : [];
          state.totalSnaps = typeof loaded.totalSnaps === 'number' ? loaded.totalSnaps : 0;
          state.quarter = loaded.quarter >= 1 && loaded.quarter <= 4 ? loaded.quarter : 1;
          state.quarterSnaps = Array.isArray(loaded.quarterSnaps) && loaded.quarterSnaps.length === 4
            ? loaded.quarterSnaps : [0,0,0,0];
          state.teamName = typeof loaded.teamName === 'string' ? loaded.teamName : 'Wilton Warriors';
          state.minPlays = clampInt(loaded.minPlays, 1, 99, 14);
          state.onField = clampInt(loaded.onField, 1, 30, 11);
          // Rosters saved before quarters existed have no per-quarter split; bank
          // their existing total into Q1 so the quarters still add up to the total.
          state.players.forEach(function(p){
            if (!Array.isArray(p.q) || p.q.length !== 4){ p.q = [p.plays || 0, 0, 0, 0]; }
          });
          // Same for the team: a game saved before quarters existed has a total but no
          // split. Bank it into Q1 so quarter totals add up and match the players'.
          var qsum = state.quarterSnaps.reduce(function(a,b){ return a + b; }, 0);
          if (qsum < state.totalSnaps){ state.quarterSnaps[0] += state.totalSnaps - qsum; }
        }
      }catch(e){}
    }
    render();
    fitShell();
  }).catch(function(){ render(); fitShell(); });

  // Enables offline use and makes Chrome offer "Install app". Silently skipped on file://.
  // updateViaCache:'none' stops the browser serving sw.js from its own HTTP cache, which
  // is what makes update checks miss a fresh deploy.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(function(reg){
          swReg = reg;
          reg.update().catch(function(){});          // quiet check on every launch
        })
        .catch(function(){});
    });
    // A new worker taking control means new code is live — reload once to pick it up.
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (reloadingForUpdate) return;
      reloadingForUpdate = true;
      location.reload();
    });
  }
})();
</script>
</body>
</html>
